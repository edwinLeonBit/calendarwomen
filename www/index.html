<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lunaria | Calendario menstrual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="brand-header">
            <img class="brand-logo" src="assets/lunaria-logo.png" alt="Lunaria: Tu ciclo, en tus manos">
        </header>

        <h1>Mi calendario menstrual</h1>
        
        <div class="config-panel">
            <h2>Configura tu ciclo</h2>
            <label for="last-period">Fecha de última regla:</label>
            <input type="date" id="last-period">
            
            <label for="cycle-length">Duración del ciclo (días):</label>
            <input type="number" id="cycle-length" value="28" min="20" max="45">

            <label for="period-length">Duración de la regla (días):</label>
            <input type="number" id="period-length" value="5" min="1" max="10">

            <button id="calculate-btn">Calcular Ciclo</button>
        </div>

        <div class="calendar-panel">
            <div class="calendar-header">
                <button id="prev-month">&lt;</button>
                <h2 id="month-year-display"></h2>
                <button id="next-month">&gt;</button>
            </div>
            
            <div class="weekdays">
                <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
            </div>
            
            <div id="days-grid" class="days-grid"></div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot period"></span> Sangrado</div>
            <div class="legend-item"><span class="dot fertile"></span> Fertilidad (Ovulación)</div>
            <div class="legend-item"><span class="dot infertile"></span> No fértil</div>
        </div>

        <footer class="brand-credit">Desarrollada por DOE (Danna, Omar y Edison)</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
